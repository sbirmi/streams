[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stream"
version = "0.1.0"
description = "A small shared stream-of-thoughts notes application"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

