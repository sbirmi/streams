<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A fast shared stream-of-thoughts notes application">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
  </head>
  <body>
    <main class="app-shell">
      <div class="app-chrome">
        <header class="topbar">
          <div class="brand"><span class="brand-mark">S</span><span class="brand-copy"><span class="brand-prefix">streams :</span> <span id="bundle-name" class="breadcrumb">Loading…</span></span></div>
          <div class="topbar-actions">
            <label class="username-field"><span class="sr-only">Your username</span><input id="username" type="text" value="" placeholder="username" autocomplete="nickname"></label>
            <button class="icon-button" type="button" title="Keyboard shortcuts" data-action="shortcuts">?</button>
          </div>
        </header>
        <section class="viewbar" aria-label="Viewbar controls">
          <label class="search-control"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Filter streams" autocomplete="off"></label>
          <div class="toolbar-controls"><label class="compact-control"><span class="sr-only">View</span><select id="view-select"><option value="priority">Priority</option><option value="recent">Recently touched</option><option value="stale">Stale</option></select></label><button class="secondary-button" type="button" data-action="add-stream">Add stream</button></div>
          <div id="toolbar-stats" class="toolbar-stats">Loading streams…</div>
        </section>
      </div>
      <div id="command-hud" class="command-hud" aria-live="polite" hidden></div>
      <section id="stream-list" class="stream-list" aria-label="Streams" tabindex="0"><div class="empty-filter">Loading streams…</div></section>
      <footer class="prototype-footer"><span id="status-message">Shared workspace</span><button type="button" data-action="refresh">Refresh</button></footer>
    </main>

    <dialog id="editor-dialog" class="editor-dialog">
      <form id="editor-form" method="dialog">
        <div class="dialog-heading"><h2 id="editor-title">Edit stream</h2><button class="icon-button" type="button" data-action="close-editor" aria-label="Close">×</button></div>
        <p id="editor-placement" class="editor-placement"></p>
        <label>Summary<input id="editor-summary" name="summary" required></label>
        <label>Description<textarea id="editor-description" name="description" rows="7"></textarea></label>
        <label>Priority (optional)<input id="editor-priority" name="priority" type="number" min="0" placeholder="No priority"></label>
        <p id="editor-error" class="form-error" role="alert"></p>
        <div class="dialog-actions"><button class="secondary-button" type="button" data-action="close-editor">Cancel</button><button type="submit">Save</button></div>
      </form>
    </dialog>
    <dialog id="comment-dialog" class="editor-dialog">
      <form id="comment-form" method="dialog">
        <div class="dialog-heading"><h2 id="comment-title">Add comment</h2><button class="icon-button" type="button" data-action="close-comment" aria-label="Close">×</button></div>
        <label for="comment-body">Comment<textarea id="comment-body" name="body" rows="7" required></textarea></label>
        <p id="comment-error" class="form-error" role="alert"></p>
        <div class="dialog-actions"><button class="secondary-button" type="button" data-action="close-comment">Cancel</button><button id="comment-submit" type="submit">Add comment</button></div>
      </form>
    </dialog>
    <dialog id="delete-dialog" class="editor-dialog">
      <form id="delete-form" method="dialog">
        <div class="dialog-heading"><h2 id="delete-title">Delete item?</h2><button class="icon-button" type="button" data-action="close-delete" aria-label="Close">×</button></div>
        <p id="delete-message" class="editor-placement"></p>
        <p id="delete-error" class="form-error" role="alert"></p>
        <div class="dialog-actions"><button class="secondary-button" type="button" data-action="close-delete">Cancel</button><button class="danger-button" type="submit">Delete</button></div>
      </form>
    </dialog>
    <dialog id="shortcuts-dialog" class="shortcuts-dialog">
      <div class="dialog-heading"><h2>Keyboard shortcuts</h2><button class="icon-button" type="button" data-action="close-shortcuts" aria-label="Close">×</button></div>
      <dl id="shortcut-list" class="shortcut-list"></dl>
    </dialog>
  </body>
</html>
