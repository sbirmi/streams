<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A fast shared stream-of-thoughts notes application">
    <meta name="application-name" content="{{ app_name }}">
    <title>streams: {{ page_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
  </head>
  <body>
    <main class="app-shell">
      <div class="app-chrome">
        <header class="topbar">
          <div class="brand"><span class="brand-mark">S</span><span class="brand-copy"><span class="brand-prefix">streams :</span> <span id="bundle-name" class="breadcrumb">Loading…</span></span></div>
          <div class="topbar-actions">
            <label class="username-field"><span class="sr-only">Your username</span><input id="username" type="text" value="" placeholder="username" autocomplete="nickname"></label>
            <a class="secondary-button" href="/transactions">Transactions</a><button class="secondary-button" type="button" data-action="dashboard">Dashboard</button><button class="secondary-button" type="button" data-action="index" hidden>Index</button><button class="icon-button" type="button" title="Keyboard shortcuts" data-action="shortcuts">?</button>
          </div>
        </header>
        <section class="viewbar" aria-label="Viewbar controls">
          <label class="search-control"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Filter streams" autocomplete="off"></label>
          <div class="toolbar-controls"><label class="compact-control"><span class="sr-only">View</span><select id="view-select"><option value="priority">Priority</option><option value="recent">Recently touched</option><option value="manual">Manual order</option><option value="stale">Stale</option><option value="deadline">Deadline</option></select></label><button class="secondary-button" type="button" data-action="add-stream">Add stream</button></div>
          <div id="toolbar-stats" class="toolbar-stats"><span class="toolbar-count">Loading streams…</span></div>
        </section>
      </div>
      <div id="command-hud" class="command-hud" aria-live="polite" hidden></div>
      <section id="stream-list" class="stream-list" aria-label="Streams" tabindex="0"><div class="empty-filter">Loading streams…</div></section>
      <footer class="prototype-footer"><span id="status-message">Shared workspace</span><span id="transaction-status" class="transaction-status" hidden aria-live="polite"><span class="transaction-status-copy"></span> <a href="/transactions" title="Transaction history">history</a></span><button type="button" data-action="refresh">Refresh</button></footer>
    </main>

    <dialog id="editor-dialog" class="editor-dialog">
      <form id="editor-form" method="dialog">
        <div class="dialog-heading"><h2 id="editor-title">Edit stream</h2><div class="dialog-heading-actions"><button class="secondary-button" type="button" id="editor-mode-toggle" data-action="toggle-editor-mode" hidden>Edit</button><button class="icon-button" type="button" data-action="close-editor" aria-label="Close">×</button></div></div>
        <p id="editor-placement" class="editor-placement"></p>
        <section id="editor-rendered" class="content-preview" aria-label="Rendered stream content" hidden>
          <div class="content-preview-toolbar"><span>Rendered</span><div class="copy-actions"><button class="secondary-button" type="button" data-copy-stream-id>Copy reference</button><button class="secondary-button" type="button" data-copy-stream-link>Copy link</button></div></div>
          <h3 id="editor-rendered-summary" class="content-preview-summary"></h3>
          <div id="editor-rendered-description" class="markdown-content"></div>
        </section>
        <div id="editor-fields" class="editor-fields">
          <label>Summary *<input id="editor-summary" name="summary" required></label>
          <label>Description<textarea id="editor-description" name="description" rows="7"></textarea></label>
        </div>
        <div class="editor-metadata" role="group" aria-label="Stream metadata">
          <label class="editor-owners-field">Owners, comma-separated<input id="editor-owners" name="owners" type="text" autocomplete="off"></label>
          <label class="editor-priority-field">Priority<input id="editor-priority" name="priority" type="number" min="0" inputmode="numeric"></label>
          <label class="editor-deadline-field">Deadline<input id="editor-deadline" name="deadline" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" autocomplete="off" aria-describedby="editor-deadline-help"></label>
          <label class="editor-order-key-field">Order key<input id="editor-order-key" name="order_key" type="number" readonly aria-describedby="editor-order-key-help"></label>
        </div>
        <p id="editor-order-key-help" class="field-help">Managed automatically to preserve sibling order.</p>
        <p id="editor-deadline-help" class="field-help">Use YYYY-MM-DD; YYYY/MM/DD is also accepted.</p>
        <div class="editor-tags-row">
          <label>Tags<input id="editor-tags" name="tags" type="text" autocomplete="off"></label>
        </div>
        <p id="editor-error" class="form-error" role="alert"></p>
        <div class="dialog-actions"><button class="secondary-button" type="button" data-action="close-editor">Cancel</button><button id="editor-submit" type="submit">Save</button></div>
      </form>
    </dialog>
    <dialog id="comment-dialog" class="editor-dialog">
      <form id="comment-form" method="dialog">
        <div class="dialog-heading"><h2 id="comment-title">Add comment</h2><div class="dialog-heading-actions"><button class="secondary-button" type="button" id="comment-mode-toggle" data-action="toggle-comment-mode" hidden>Edit</button><button class="icon-button" type="button" data-action="close-comment" aria-label="Close">×</button></div></div>
        <section id="comment-rendered" class="content-preview" aria-label="Rendered comment" hidden>
          <div class="content-preview-toolbar"><span>Rendered</span><div class="copy-actions"><button class="secondary-button" type="button" data-copy-comment-id>Copy reference</button><button class="secondary-button" type="button" data-copy-comment-link>Copy link</button></div></div>
          <div id="comment-rendered-body" class="markdown-content"></div>
        </section>
        <div id="comment-fields" class="editor-fields"><label for="comment-body">Comment<textarea id="comment-body" name="body" rows="7" required></textarea></label></div>
        <p id="comment-error" class="form-error" role="alert"></p>
        <div class="dialog-actions"><button class="secondary-button" type="button" data-action="close-comment">Cancel</button><button id="comment-submit" type="submit">Add comment</button></div>
      </form>
    </dialog>
    <dialog id="delete-dialog" class="editor-dialog">
      <form id="delete-form" method="dialog">
        <div class="dialog-heading"><h2 id="delete-title">Delete item?</h2></div>
        <p id="delete-message" class="editor-placement"></p>
        <p id="delete-error" class="form-error" role="alert"></p>
        <div class="dialog-actions"><button id="delete-cancel" class="secondary-button" type="button" data-action="close-delete" autofocus>Cancel</button><button class="danger-button" type="submit">Delete</button></div>
      </form>
    </dialog>
    <dialog id="shortcuts-dialog" class="shortcuts-dialog">
      <div class="dialog-heading"><h2>Keyboard shortcuts</h2><button class="icon-button" type="button" data-action="close-shortcuts" aria-label="Close">×</button></div>
      <dl id="shortcut-list" class="shortcut-list"></dl>
    </dialog>
  </body>
</html>
