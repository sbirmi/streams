<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Shared transaction history for Streams">
    <title>streams: Transactions</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script defer src="{{ url_for('static', filename='js/transactions.js') }}"></script>
  </head>
  <body>
    <main class="app-shell transactions-shell">
      <header class="topbar">
        <div class="brand"><a class="brand-mark" href="/" aria-label="Streams home">S</a><div class="brand-copy"><span class="brand-prefix">streams :</span> <span class="breadcrumb">transactions</span></div></div>
        <div class="topbar-actions"><a class="secondary-button" href="/">Back to streams</a></div>
      </header>

      <section class="transactions-heading">
        <div><h1>Transaction history</h1><p>Shared changes, undo/redo actions, and retained abandoned branches.</p></div>
        <span id="transaction-count" class="toolbar-stats" aria-live="polite">Loading…</span>
      </section>

      <form id="transaction-filters" class="transaction-filters" role="search">
        <label class="search-control transaction-search"><span aria-hidden="true">⌕</span><span class="sr-only">Search transactions</span><input id="transaction-query" type="search" placeholder="Search summary, actor, or ID" autocomplete="off"></label>
        <label class="compact-control"><span class="sr-only">Kind</span><select id="transaction-kind"><option value="">All kinds</option><option value="mutation">Changes</option><option value="undo">Undo</option><option value="redo">Redo</option></select></label>
        <label class="compact-control"><span class="sr-only">State</span><select id="transaction-state"><option value="">All states</option><option value="active">Active</option><option value="undone">Undone</option><option value="abandoned">Abandoned</option></select></label>
        <button class="secondary-button" type="reset">Clear</button>
      </form>

      <section id="transaction-list" class="transaction-list" aria-label="Transaction history" aria-live="polite"><div class="empty-filter">Loading transactions…</div></section>
      <aside id="transaction-detail" class="transaction-detail" hidden aria-live="polite"></aside>
      <footer class="prototype-footer"><span id="transaction-status">History is read-only.</span><a href="/">Streams</a></footer>
    </main>
  </body>
</html>
